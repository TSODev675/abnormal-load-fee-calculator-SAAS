{% extends 'dashboard/base_dashboard.html' %}
{% load static %}

{% block title %}Subscription{% endblock %}

{% block content %}
<div x-data="{ 
        showCardPayment: false, 
        showEftPayment: false, 
        showApplePay: false, 
        showGooglePay: false, 
        showConfirmation: false, 
        showBankLogin: false, 
        selectedBank: '', 
        selectedBankColor: '' 
    }">

    <section class="bg-gray-100 py-20">
        <div class="container mx-auto px-6 text-center">
            <h2 class="text-4xl font-bold mb-8">Subscribe to {{ selected_plan }}</h2>
            <p class="text-lg text-gray-700 mb-6">Choose a payment method below:</p>

            <!-- Payment Options Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <button @click="showCardPayment = true" class="bg-white p-6 rounded-lg shadow-md flex flex-col items-center justify-center hover:shadow-lg transition w-full">
                    <img src="{% static 'images/visamastercard.png' %}" alt="Visa/Mastercard" class="h-16 mb-2">
                    <span class="text-lg font-semibold text-gray-700">Visa/Mastercard</span>
                </button>
                <button @click="showEftPayment = true" class="bg-white p-6 rounded-lg shadow-md flex flex-col items-center justify-center hover:shadow-lg transition w-full">
                    <img src="{% static 'images/ozoweft.png' %}" alt="EFT (Ozow)" class="h-16 mb-2">
                    <span class="text-lg font-semibold text-gray-700">EFT (Ozow)</span>
                </button>
                <button @click="showApplePay = true" class="bg-white p-6 rounded-lg shadow-md flex flex-col items-center justify-center hover:shadow-lg transition w-full">
                    <img src="{% static 'images/applepay.png' %}" alt="Apple Pay" class="h-16 mb-2">
                    <span class="text-lg font-semibold text-gray-700">Apple Pay</span>
                </button>
                <button @click="showGooglePay = true" class="bg-white p-6 rounded-lg shadow-md flex flex-col items-center justify-center hover:shadow-lg transition w-full">
                    <img src="{% static 'images/googlepay.png' %}" alt="Google Pay" class="h-16 mb-2">
                    <span class="text-lg font-semibold text-gray-700">Google Pay</span>
                </button>
            </div>
        </div>
    </section>

    <!-- EFT Ozow Popup (Bank Selection) -->
    <template x-if="showEftPayment">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4">
            <div class="bg-white p-6 rounded-lg shadow-md w-96 relative">
                <button @click="showEftPayment = false" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">✖</button>
                <h2 class="text-xl font-bold mb-4">Select Your Bank</h2>
    
                <div class="grid grid-cols-1 gap-2">
                    <template x-for="(bank, index) in [
                        {name: 'ABSA', color: 'border-red-500 bg-red-100'},
                        {name: 'Capitec Pay', color: 'border-blue-500 bg-blue-100'},
                        {name: 'FNB', color: 'border-green-500 bg-green-100'},
                        {name: 'Investec', color: 'border-black bg-gray-100'},
                        {name: 'Nedbank', color: 'border-green-700 bg-green-200'},
                        {name: 'Standard Bank', color: 'border-blue-700 bg-blue-200'},
                        {name: 'African Bank', color: 'border-purple-500 bg-purple-100'},
                        {name: 'BidvestBank', color: 'border-orange-500 bg-orange-100'},
                        {name: 'TymeBank', color: 'border-yellow-500 bg-yellow-100'}
                    ]" :key="index">
                        
                        <button 
                            @click="selectedBank = bank.name; showEftPayment = false; showBankLogin = true"
                            class="flex justify-between items-center p-3 rounded-md border transition w-full"
                            :class="selectedBank === bank.name ? `${bank.color} border-4` : 'border-gray-300'">
                            
                            <div class="flex items-center">
                                <span class="w-2 h-6 rounded-l-md" :class="bank.color"></span>
                                <span class="text-lg font-semibold ml-3" x-text="bank.name"></span>
                            </div>
                            
                            <span class="text-blue-600">Select</span>
                        </button>
                        
                    </template>
                </div>
            </div>
        </div>
    </template>
    
    <!-- Bank Login Popup (Triggered after selecting a bank) -->
    <template x-if="showBankLogin">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4">
            <div class="bg-white p-6 rounded-lg shadow-md w-96 relative">
                <button @click="showBankLogin = false" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">✖</button>
                <h2 class="text-xl font-bold mb-4">Login to <span x-text="selectedBank"></span></h2>
                
                <input type="text" placeholder="Account Username" class="w-full p-2 border rounded mb-2">
                <input type="password" placeholder="Bank Password" class="w-full p-2 border rounded mb-2">
                
                <button @click="showBankLogin = false; showConfirmation = true" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Confirm Subscription</button>
            </div>
        </div>
    </template>
    

    <!-- Subscription Confirmation Popup -->
     <!-- Visa/Mastercard Popup -->
     <template x-if="showCardPayment">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4">
            <div class="bg-white p-6 rounded-lg shadow-md w-96 relative">
                <button @click="showCardPayment = false" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">✖</button>
                <h2 class="text-xl font-bold mb-4">Enter Card Details</h2>
                <input type="text" placeholder="Card Number" class="w-full p-2 border rounded mb-2">
                <input type="text" placeholder="Expiry Date (MM/YY)" class="w-full p-2 border rounded mb-2">
                <input type="text" placeholder="CVV" class="w-full p-2 border rounded mb-2">
                <button @click="showCardPayment = false; showConfirmation = true" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Confirm Subscription</button>
            </div>
        </div>
    </template>

    <!-- Apple Pay Popup -->
    <template x-if="showApplePay">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4">
            <div class="bg-white p-6 rounded-lg shadow-md w-96 relative">
                <button @click="showApplePay = false" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">✖</button>
                <h2 class="text-xl font-bold mb-4">Apple Pay Confirmation</h2>
                <img src="{% static 'images/applepay.png' %}" alt="Apple Pay" class="h-16 mx-auto mb-4">
                <button @click="showApplePay = false; showConfirmation = true" class="bg-green-600 text-white px-4 py-2 rounded w-full">Confirm Payment</button>
            </div>
        </div>
    </template>

    <!-- Google Pay Popup -->
    <template x-if="showGooglePay">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4">
            <div class="bg-white p-6 rounded-lg shadow-md w-96 relative">
                <button @click="showGooglePay = false" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">✖</button>
                <h2 class="text-xl font-bold mb-4">Google Pay Confirmation</h2>
                <img src="{% static 'images/googlepay.png' %}" alt="Google Pay" class="h-16 mx-auto mb-4">
                <button @click="showGooglePay = false; showConfirmation = true" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Confirm Payment</button>
            </div>
        </div>
    </template>

    <!-- Subscription Confirmation Popup -->
    <template x-if="showConfirmation">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4">
            <div class="bg-white p-6 rounded-lg shadow-md w-96 relative">
                <button @click="showConfirmation = false" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">✖</button>
                <h2 class="text-xl font-bold mb-4 text-green-600">✅ Subscription Successful!</h2>
                <p class="text-gray-700 mb-4">You are now subscribed to <strong>{{ selected_plan }}</strong>.</p>
                <p class="text-gray-600 text-sm">Redirecting to dashboard in <span x-text="countdown"></span> seconds...</p>
    
                <button @click="redirectToDashboard()" class="bg-green-600 text-white px-4 py-2 rounded w-full mt-4">Go to Dashboard Now</button>
            </div>
        </div>
    </template>
</div>

{% block extra_js %}
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
    function redirectToDashboard() {
        window.location.href = "{% url 'dashboard' %}";  // Redirect to the dashboard
    }

    document.addEventListener("alpine:init", () => {
        Alpine.data("subscriptionFlow", () => ({
            countdown: 3000,  // Set countdown timer
            
            startCountdown() {
                let timer = setInterval(() => {
                    if (this.countdown > 1) {
                        this.countdown--;
                    } else {
                        clearInterval(timer);
                        redirectToDashboard();
                    }
                }, 1000);
            }
        }));
    });
</script>
{% endblock %}

{% endblock %}
