{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AbnormalLoads{% endblock %}</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <script src="https://unpkg.com/@barba/core"></script>

    <style>
        /* Apply animations ONLY for Login & Signup */
        body.auth-bg {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 12s infinite alternate ease-in-out;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0.8;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); opacity: 0.8; }
            50% { transform: translateY(-100px); opacity: 0.5; }
            100% { transform: translateY(0px); opacity: 0.8; }
        }
    </style>
</head>

<!-- Ensure "auth-bg" class is applied to body -->
<body class="auth-bg flex items-center justify-center min-h-screen">

    <!-- Floating Particles -->
    <div id="particles"></div>

    <div data-barba="wrapper" class="w-full max-w-lg px-6">
        <main data-barba="container" data-barba-namespace="auth">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{% static 'js/main.js' %}"></script>

    <script>
        function initializeBackground() {
            // Ensure particles are only added on auth pages
            if (!document.body.classList.contains("auth-bg")) return;

            let particleContainer = document.getElementById("particles");
            if (!particleContainer) {
                particleContainer = document.createElement("div");
                particleContainer.id = "particles";
                document.body.prepend(particleContainer);
            }

            particleContainer.innerHTML = ""; // Clear old particles
            let numParticles = 20;

            for (let i = 0; i < numParticles; i++) {
                let particle = document.createElement("div");
                particle.classList.add("particle");

                let size = Math.random() * 6 + 4;
                let posX = Math.random() * window.innerWidth;
                let posY = Math.random() * window.innerHeight;
                let duration = Math.random() * 5 + 10;

                particle.style.width = size + "px";
                particle.style.height = size + "px";
                particle.style.left = posX + "px";
                particle.style.top = posY + "px";
                particle.style.animationDuration = duration + "s";

                particleContainer.appendChild(particle);
            }
        }

        // Apply animations only on auth pages
        barba.init({
            transitions: [{
                name: "fade",
                leave(data) {
                    return gsap.to(data.current.container, { opacity: 0, duration: 0.5 });
                },
                enter(data) {
                    return gsap.from(data.next.container, {
                        opacity: 0,
                        duration: 0.5,
                        onComplete: () => {
                            if (data.next.namespace === "auth") {
                                document.body.classList.add("auth-bg");
                                initializeBackground();
                            } else {
                                document.body.classList.remove("auth-bg");
                                document.getElementById("particles")?.remove();
                            }
                        }
                    });
                }
            }]
        });

        // Apply background on first load
        document.addEventListener("DOMContentLoaded", initializeBackground);
    </script>
</body>
</html>
