{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AbnormalLoads{% endblock %}</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <style>
        /* Background Animation */
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 12s infinite alternate ease-in-out;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0.8;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); opacity: 0.8; }
            50% { transform: translateY(-100px); opacity: 0.5; }
            100% { transform: translateY(0px); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- Floating Particles -->
    <div id="particles"></div>

    <!-- Page Padding to prevent content from being hidden under fixed header -->
    <div class="mt-20"></div>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white py-8">
        <div class="container mx-auto px-6">
            <div class="flex flex-wrap justify-between">
                <!-- Footer Content Here -->
            </div>
            <div class="border-t border-gray-700 mt-8 pt-8 text-center">
                <p>&copy; 2024 AbnormalLoad. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>

    <script>
        // Generate Floating Particles
        document.addEventListener("DOMContentLoaded", function() {
            let numParticles = 20;  // Number of floating elements
            let particleContainer = document.getElementById("particles");

            for (let i = 0; i < numParticles; i++) {
                let particle = document.createElement("div");
                particle.classList.add("particle");

                let size = Math.random() * 6 + 4; // Random size
                let posX = Math.random() * window.innerWidth;
                let posY = Math.random() * window.innerHeight;
                let duration = Math.random() * 5 + 10; // Random animation duration

                particle.style.width = size + "px";
                particle.style.height = size + "px";
                particle.style.left = posX + "px";
                particle.style.top = posY + "px";
                particle.style.animationDuration = duration + "s";

                particleContainer.appendChild(particle);
            }
        });

        // JavaScript for toggling mobile menu
        document.getElementById('menu-toggle')?.addEventListener('click', function() {
            var menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
