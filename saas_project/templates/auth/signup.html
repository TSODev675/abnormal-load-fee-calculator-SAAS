{% extends 'landing/base_auth.html' %}
{% load static %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-bold text-center mb-6">Create an Account</h2>
        <form action="{% url 'subscription' %}" method="GET">
            <input type="hidden" name="plan" value="{{ request.GET.plan }}">

            <div class="mb-4">
                <label class="block text-gray-700">Full Name</label>
                <input type="text" name="full_name" class="w-full p-2 border border-gray-300 rounded-md" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Email</label>
                <input type="email" name="email" class="w-full p-2 border border-gray-300 rounded-md" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Password</label>
                <input type="password" name="password" class="w-full p-2 border border-gray-300 rounded-md" required>
            </div>
            <button type="submit"
                class="w-full bg-green-500 text-white py-2 rounded-md hover:bg-green-600 transition">
                Sign Up
            </button>
        </form>

        <p class="text-center mt-4 text-gray-600">Already have an account? 
            <a href="{% url 'login' %}?plan={{ request.GET.plan }}" class="text-blue-500 font-semibold">Login</a>
        </p>
    </div>
</div>
{% endblock %}
