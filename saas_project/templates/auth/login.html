{% extends 'landing/base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-bold text-center mb-6">Login</h2>
        <form action="{% url 'subscription' %}" method="GET">
            <input type="hidden" name="plan" value="{{ request.GET.plan }}">
            
            <div class="mb-4">
                <label class="block text-gray-700">Email</label>
                <input type="email" name="email" class="w-full p-2 border border-gray-300 rounded-md" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Password</label>
                <input type="password" name="password" class="w-full p-2 border border-gray-300 rounded-md" required>
            </div>
            <button type="submit"
                class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 transition">
                Login
            </button>
        </form>

        <p class="text-center mt-4 text-gray-600">Don't have an account? 
            <a href="{% url 'signup' %}?plan={{ request.GET.plan }}" class="text-blue-500 font-semibold">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
