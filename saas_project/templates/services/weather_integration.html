{% extends 'dashboard/base_dashboard.html' %}
{% load static %}

{% block title %}Weather Integration{% endblock %}

{% block content %}
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- Tailwind & Custom Styles -->
<style>
    body {
        font-family: 'Poppins', sans-serif;
    }

    .weather-container {
        max-width: 900px;
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .weather-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        width: 100%;
        max-width: 800px;
    }

    .form-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    .weather-icon {
        font-size: 3rem;
        color: #0096c7;
    }

    .forecast-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 15px;
    }

    .forecast-card {
        background: #f1f5f9;
        padding: 10px;
        border-radius: 8px;
        text-align: center;
        transition: transform 0.3s;
    }

    .forecast-card:hover {
        transform: scale(1.05);
    }
</style>

<div class="weather-container py-8">
    <h1 class="text-4xl font-bold text-center text-gray-900">🌦 Weather Integration</h1>
    <p class="text-lg text-center text-gray-600 mb-6">Select a country and province to get live weather updates.</p>

    <!-- Selection Form -->
    <div class="weather-card">
        <form id="weather-form" class="form-container">
            <!-- Country Selection -->
            <div>
                <label class="font-semibold text-gray-700">Country:</label>
                <select id="country-select" class="border border-gray-300 rounded-lg p-3 text-lg w-full" onchange="fetchProvinces()">
                    <option value="South Africa" selected>South Africa</option>
                    <option value="Namibia">Namibia</option>
                </select>
            </div>

            <!-- Province Selection -->
            <div>
                <label class="font-semibold text-gray-700">Province:</label>
                <select id="province-select" class="border border-gray-300 rounded-lg p-3 text-lg w-full">
                    <option value="">Select a province</option>
                </select>
            </div>

            <button type="button" onclick="submitWeatherForm()" class="bg-blue-500 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-600 transition duration-200">
                Get Weather
            </button>
        </form>
    </div>

    <!-- Weather Information Display -->
    <div id="weather-info" class="weather-card hidden mt-6 text-center">
        <h2 class="text-3xl font-bold text-gray-800" id="weather-province">Province</h2>
        <p class="text-6xl font-bold text-blue-600 mt-2" id="weather-temperature">--°C</p>
        <p class="text-lg text-gray-600 mt-2" id="weather-condition">Loading...</p>

        <!-- 5-Day Forecast -->
        <h3 class="text-2xl font-bold text-gray-800 mt-6">📅 5-Day Forecast</h3>
        <div id="daily-forecast" class="forecast-grid">
            <!-- Forecast will be added dynamically -->
        </div>
    </div>
</div>

<!-- JavaScript for Weather Integration -->
<script>
    function fetchProvinces() {
        const country = document.getElementById("country-select").value;
        const provinceSelect = document.getElementById("province-select");

        // Clear current options
        provinceSelect.innerHTML = '<option value="">Select a province</option>';

        let provinces = country === "South Africa" ? 
            ['Eastern Cape', 'Free State', 'Gauteng', 'KwaZulu-Natal', 'Limpopo', 'Mpumalanga', 'Northern Cape', 'North West', 'Western Cape'] :
            ['Erongo', 'Hardap', 'Kavango East', 'Khomas', 'Kunene', 'Ohangwena', 'Omaheke', 'Omusati', 'Oshana', 'Oshikoto', 'Zambezi'];

        provinces.forEach(province => {
            let option = document.createElement("option");
            option.value = province;
            option.textContent = province;
            provinceSelect.appendChild(option);
        });
    }

    function submitWeatherForm() {
        const country = document.getElementById("country-select").value;
        const province = document.getElementById("province-select").value;

        if (!province) {
            alert("Please select a province.");
            return;
        }

        const url = `/weather-integration/?country=${country}&province=${province}`;

        fetch(url, { headers: { 'x-requested-with': 'XMLHttpRequest' } })
            .then(response => response.json())
            .then(data => {
                if (data.weather_info) {
                    displayWeatherData(data);
                } else {
                    console.error("Could not retrieve weather data.");
                }
            })
            .catch(error => console.error("Error:", error));
    }

    function displayWeatherData(data) {
        document.getElementById("weather-province").innerText = data.selected_province;
        document.getElementById("weather-temperature").innerText = `${data.weather_info.daily.temperature_2m_max[0]}°C`;
        document.getElementById("weather-condition").innerText = data.weather_info.description;

        const dailyForecastContainer = document.getElementById("daily-forecast");
        dailyForecastContainer.innerHTML = "";

        data.daily_weather_data.slice(0, 5).forEach(([day, max_temp, min_temp, precip]) => {
            let dayDiv = document.createElement("div");
            dayDiv.className = "forecast-card";
            dayDiv.innerHTML = `
                <p class="text-lg font-semibold">${day}</p>
                <i class="fas fa-cloud-sun-rain weather-icon"></i>
                <p class="text-lg font-bold">Max: ${max_temp}°C</p>
                <p class="text-lg font-bold">Min: ${min_temp}°C</p>
                <p class="text-sm text-gray-600">Precip: ${precip} mm</p>
            `;
            dailyForecastContainer.appendChild(dayDiv);
        });

        document.getElementById("weather-info").classList.remove("hidden");
    }

    document.addEventListener("DOMContentLoaded", fetchProvinces);
</script>
{% endblock %}
